<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keystone Permanent Solutions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAV -->
  <nav>
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <img src="/logo.png" alt="Keystone Logo" height="42">
      <strong>Keystone Permanent Solutions</strong>
    </div>
    <a href="tel:6156032573"><button class="btn">Call Now</button></a>
  </nav>

  <!-- HERO -->
  <section class="hero text-center">
    <h1>Finally Fix What's Been Temporary</h1>
    <p>We handle the headache so you can run your business.</p>
    <a href="tel:6156032573"><button class="btn">Call 615-603-2573</button></a>
  </section>

  <!-- CARDS (DYNAMIC) -->
  <section class="container grid md-grid-2" id="cards-section">
    <!-- Cards loaded from site.json -->
  </section>

  <!-- TESTIMONIALS (DYNAMIC) -->
  <section class="container text-center" id="testimonials-section">
    <h2>Trusted By Small Businesses</h2>
    <!-- Testimonials loaded from site.json -->
  </section>

  <!-- CALCULATOR -->
  <section class="container">
    <div class="card" style="max-width:500px; margin:0 auto;">
      <h2>Project Pricing Estimator</h2>
      <input type="number" id="budget" placeholder="Enter your budget">
      <label style="display:flex; gap:0.5rem; margin-top:0.5rem;">
        <input type="checkbox" id="priority"> Priority Service (+$200)
      </label>
      <p>Our Fee: $<span id="fee">0</span></p>
    </div>
  </section>

  <!-- CONTACT FORM -->
  <section class="container">
    <div class="card" style="max-width:500px; margin:0 auto;">
      <h2>Start Your Project</h2>
      <form id="projectForm">
        <input name="name" placeholder="Your Name" required>
        <input name="business" placeholder="Business Name">
        <input name="phone" placeholder="Phone Number" required>
        <input name="budget" id="formBudget" readonly>
        <textarea name="details" placeholder="What needs to be fixed?"></textarea>
        <input type="file" name="photo">
        <button type="submit" class="btn">Submit Project</button>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <div class="text-center" style="padding:2rem; color:#777;">
    © Keystone Permanent Solutions
  </div>

  <!-- SCRIPT -->
  <script>
    // Load dynamic cards and testimonials
    fetch('site.json')
      .then(res => res.json())
      .then(data => {
        // Render cards
        const cardsContainer = document.getElementById('cards-section');
        data.cards.forEach(card => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card';
          cardEl.innerHTML = `<h3>${card.title}</h3><p>${card.description}</p>`;
          cardsContainer.appendChild(cardEl);
        });

        // Render testimonials
        const testimonialsContainer = document.getElementById('testimonials-section');
        data.testimonials.forEach(t => {
          const tEl = document.createElement('div');
          tEl.className = 'testimonial';
          tEl.innerHTML = `"${t.quote}"<br><strong>- ${t.author}</strong>`;
          testimonialsContainer.appendChild(tEl);
        });
      })
      .catch(err => console.error('Error loading site.json:', err));

    // Calculator
    const budgetInput = document.getElementById('budget');
    const priorityInput = document.getElementById('priority');
    const feeEl = document.getElementById('fee');
    const formBudget = document.getElementById('formBudget');

    function calculateFee() {
      let budget = parseFloat(budgetInput.value) || 0;
      let fee = budget + (priorityInput.checked ? 200 : 0);
      feeEl.textContent = fee;
      formBudget.value = budget;
    }

    budgetInput.addEventListener('input', calculateFee);
    priorityInput.addEventListener('change', calculateFee);

    // Contact form submit via mailto
    const form = document.getElementById('projectForm');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const formData = new FormData(form);
      let body = "New Keystone Project:\n";
      for (let [k,v] of formData.entries()) {
        body += `${k}: ${v}\n`;
      }
      window.location.href = `mailto:eddie.snyder@getkeystoneps.com?subject=New Project Request&body=${encodeURIComponent(body)}`;
    });
  </script>
</body>
</html>
