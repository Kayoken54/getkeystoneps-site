<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keystone Permanent Solutions</title>
<link rel="icon" href="logo.png"/>
<style>
body{font-family:Arial;margin:0;background:#fff;color:#1f2937}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hero{background:linear-gradient(#0B1F3A,#132F52);color:white;text-align:center;padding:80px 20px}
.section{padding:60px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:1000px;margin:auto}
.card{background:#f8f9fb;padding:25px;border-radius:12px}
button{background:#C8A46A;border:none;padding:12px 18px;border-radius:10px;font-weight:600}
.testimonials{max-width:900px;margin:auto;display:grid;gap:20px}
.testimonial{background:#f8f9fb;padding:20px;border-radius:12px}
</style>
</head>
<body>

<nav>
<div style="display:flex;align-items:center;gap:10px">
<img src="logo.png" height="42"/>
<strong>Keystone Permanent Solutions</strong>
</div>
<a href="tel:6156032573"><button>Call Now</button></a>
</nav>

<section class="hero">
<h1 id="headline">Finally Fix What's Been Temporary</h1>
<p id="subtext">We handle the headache so you can run your business.</p>
</section>

<section class="section">
<h2 style="text-align:center">Trusted By Small Businesses</h2>
<div class="testimonials" id="testimonials"></div>
</section>

<script>
fetch('content/site.json')
.then(r=>r.json())
.then(data=>{
document.getElementById('headline').textContent=data.headline
document.getElementById('subtext').textContent=data.subtext

const wrap=document.getElementById('testimonials')
wrap.innerHTML=''
data.testimonials.forEach(t=>{
const div=document.createElement('div')
div.className='testimonial'
div.innerHTML=`"${t.quote}"<br><strong>- ${t.author}</strong>`
wrap.appendChild(div)
})
})
</script>

</body>
</html>
