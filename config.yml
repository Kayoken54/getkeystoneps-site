
backend:
  name: github
  repo: YOUR_GITHUB/YOUR_REPO
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - file: "content/site.json"
        label: "Site Content"
        name: "site"
        fields:
          - {label: Headline, name: headline, widget: string}
          - {label: Subtext, name: subtext, widget: string}
          - label: Testimonials
            name: testimonials
            widget: list
            fields:
              - {label: Quote, name: quote, widget: string}
              - {label: Author, name: author, widget: string}
